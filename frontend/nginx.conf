server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy ALL backend API paths to the backend container, so the
    # app stays single-origin (no CORS, works from any device/hostname).
    location ~ ^/(students|professors|courses|selection|auth|access|summary|all-data|docs|admin-login|openapi\.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching
    location ~* \.(js|css|woff2|webp|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
